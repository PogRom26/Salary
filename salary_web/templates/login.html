{% extends "base.html" %}

{% block content %}
  <div class="auth-card card">
    <h1>Вход</h1>
    <p class="muted">Введите логин и пароль для доступа к расчетам.</p>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
      <label>Логин<br><input type="text" name="username" required autofocus></label><br>
      <label>Пароль<br><input type="password" name="password" required></label><br>
      <button type="submit">Войти</button>
    </form>
  </div>
{% endblock %}
